<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gold Metallic Gradients -->
    <linearGradient id="goldOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE259"/>
      <stop offset="30%" stop-color="#FFA751"/>
      <stop offset="70%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#9A7412"/>
    </linearGradient>

    <linearGradient id="goldInner" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFF8DC"/>
    </linearGradient>

    <!-- Emerald Leaf & Circuit Gradients -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF66"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="circuitGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>

    <!-- Outer Dark Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base Badge -->
  <circle cx="250" cy="250" r="235" fill="#030712" stroke="url(#goldOuter)" stroke-width="10" filter="url(#goldGlow)"/>
  <circle cx="250" cy="250" r="222" fill="none" stroke="url(#goldInner)" stroke-width="3" stroke-dasharray="6,4"/>

  <!-- Top Curved Arc Text: PREMIUM TECH DEVELOPMENT -->
  <path id="textArcTop" fill="none" d="M 60,250 A 190,190 0 0,1 440,250" />
  <text font-family="'Outfit', sans-serif" font-size="19" font-weight="900" fill="url(#goldOuter)" letter-spacing="4">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      PREMIUM TECH DEVELOPMENT
    </textPath>
  </text>

  <!-- Bottom Curved Arc Text: ECO-FRIENDLY & FUTURE-READY -->
  <path id="textArcBottom" fill="none" d="M 440,250 A 190,190 0 0,1 60,250" />
  <text font-family="'Outfit', sans-serif" font-size="17" font-weight="800" fill="url(#goldOuter)" letter-spacing="3">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      ECO-FRIENDLY &amp; FUTURE-READY
    </textPath>
  </text>

  <!-- Organic Tree Roots & Branches Frame (Left and Right Arcs) -->
  <!-- Left Tree Branch Arc -->
  <g stroke="url(#goldInner)" stroke-width="3" fill="none" opacity="0.85">
    <path d="M 120,240 C 90,200 100,140 140,110 C 170,90 210,95 240,120" />
    <path d="M 140,110 C 130,80 150,60 180,70" />
    <path d="M 100,160 C 80,140 70,100 100,70" />
  </g>

  <!-- Right Tree Branch Arc -->
  <g stroke="url(#goldInner)" stroke-width="3" fill="none" opacity="0.85">
    <path d="M 380,240 C 410,200 400,140 360,110 C 330,90 290,95 260,120" />
    <path d="M 360,110 C 370,80 350,60 320,70" />
    <path d="M 400,160 C 420,140 430,100 400,70" />
  </g>

  <!-- Central Emblem "X": Leaf Wing + Circuit Wing -->
  <g filter="url(#shadowFilter)" transform="translate(0, -10)">
    
    <!-- Left Wing of X: Green Organic Leaf Pattern -->
    <path d="M 170,130 C 190,170 230,220 250,250 C 210,280 170,320 150,360 C 180,360 220,320 250,275 C 230,230 190,170 170,130 Z" fill="url(#emeraldGrad)" stroke="url(#goldOuter)" stroke-width="4"/>
    
    <!-- Leaf Inner Veins -->
    <path d="M 170,130 C 195,180 220,220 250,250" stroke="#86EFAC" stroke-width="3" fill="none" opacity="0.7"/>
    <path d="M 185,160 C 200,165 215,175 225,190" stroke="#86EFAC" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 200,190 C 215,195 230,205 240,220" stroke="#86EFAC" stroke-width="2" fill="none" opacity="0.6"/>

    <!-- Right Wing of X: Tech Circuit Pattern -->
    <path d="M 330,130 C 310,170 270,220 250,250 C 290,280 330,320 350,360 C 320,360 280,320 250,275 C 270,230 310,170 330,130 Z" fill="url(#circuitGrad)" stroke="url(#goldOuter)" stroke-width="4"/>

    <!-- Circuit Traces & Nodes -->
    <path d="M 330,130 L 290,190 L 310,220 L 270,260" stroke="url(#goldOuter)" stroke-width="3" fill="none"/>
    <circle cx="330" cy="130" r="5" fill="#FFD700"/>
    <circle cx="290" cy="190" r="4" fill="#FFD700"/>
    <circle cx="310" cy="220" r="4" fill="#FFD700"/>
    <circle cx="270" cy="260" r="5" fill="#FFD700"/>

  </g>

  <!-- Central Text Banner: DnyanX Tech -->
  <g transform="translate(250, 385)" filter="url(#shadowFilter)">
    <!-- Brand Title -->
    <text x="0" y="0" font-family="'Outfit', sans-serif" font-size="44" font-weight="900" fill="url(#goldOuter)" text-anchor="middle" letter-spacing="1">
      DnyanX <tspan fill="#FFFFFF">Tech</tspan>
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="24" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="4">
      UNIVERSAL TECH SOLUTIONS
    </text>
  </g>
</svg>
